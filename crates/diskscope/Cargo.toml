[package]
name = "diskscope"
description = "Fast cushion-treemap disk usage explorer for macOS and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "diskscope"

[dependencies]
diskscope-core = { path = "../diskscope-core" }
rayon.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
trash = "5"

[dev-dependencies]
tempfile = "3"
