[workspace]
members = ["crates/diskscope-core", "crates/diskscope"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/iloire/diskscope"

[workspace.dependencies]
rayon = "1.12"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Scanning a cold 2M-file tree under a debug build is unusable; the dev profile
# keeps debuginfo but compiles the hot loops optimised.
[profile.dev]
opt-level = 2
